name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -s bash sbx lib/*.sh image/sbx-init image/profile.sh flavors/*/build.sh flavors/*/env.sh flavors/*/hooks/*
      - name: flavor graph
        run: ./sbx flavor check
